<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jayco Website — Design Versions</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #f5f6f8;
      padding: 2rem;
    }
    h1 { font-size: 1.75rem; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
    p.sub { margin: 0; color: #9aa3af; font-size: 1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 760px;
    }
    a.card {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 1.75rem 1.5rem;
      border-radius: 14px;
      background: #1a1d24;
      border: 1px solid #2a2f3a;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    a.card:hover { transform: translateY(-3px); border-color: #4f8cff; background: #1f232c; }
    a.card .num { font-size: 2rem; font-weight: 800; color: #4f8cff; line-height: 1; }
    a.card .label { font-size: 1.05rem; font-weight: 600; }
    a.card .desc { font-size: 0.85rem; color: #9aa3af; }
    footer { color: #6b7280; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header style="text-align:center; display:flex; flex-direction:column; gap:0.5rem;">
    <h1>Jayco Website — Design Versions</h1>
    <p class="sub">Pick a version to preview.</p>
  </header>

  <nav class="grid">
    <a class="card" href="version-1/">
      <span class="num">1</span>
      <span class="label">Version 1</span>
      <span class="desc">The original approved design.</span>
    </a>
    <a class="card" href="version-2/">
      <span class="num">2</span>
      <span class="label">Version 2</span>
      <span class="desc">Alternative design exploration.</span>
    </a>
    <a class="card" href="version-3/">
      <span class="num">3</span>
      <span class="label">Version 3</span>
      <span class="desc">Alternative design exploration.</span>
    </a>
  </nav>

  <footer>All three versions share the same image &amp; video assets.</footer>
</body>
</html>
